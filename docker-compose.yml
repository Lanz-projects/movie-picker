services:
  postgres:
    image: postgres:16-alpine
    container_name: moviepicker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moviepicker}
      POSTGRES_USER: ${POSTGRES_USER:-moviepicker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviepicker_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-moviepicker} -d $${POSTGRES_DB:-moviepicker}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - moviepicker-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: moviepicker-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-moviepicker}
      DB_USER: ${POSTGRES_USER:-moviepicker}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-moviepicker_secret}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - moviepicker-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
    container_name: moviepicker-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:8080/ws}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - moviepicker-network

volumes:
  postgres_data:
    driver: local

networks:
  moviepicker-network:
    driver: bridge