spring.application.name=backend
spring.datasource.url=${DB_URL:jdbc:h2:mem:moviepicker;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# TMDB API Configuration
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.access-token=${TMDB_READ_ACCESS_TOKEN:}
tmdb.api.key=${TMDB_API_KEY:}

# Gemini / LLM AI Recommendations Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-2.5-flash-lite}
gemini.api.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.api.temperature=${GEMINI_TEMPERATURE:0.7}
gemini.api.system-instruction-path=${GEMINI_SYSTEM_INSTRUCTION_PATH:classpath:prompts/gemini-system-instruction.txt}
gemini.api.fetch-target=${GEMINI_FETCH_TARGET:8}
gemini.api.cache-ttl-minutes=${GEMINI_CACHE_TTL_MINUTES:15}

# Rate Limiting Configuration (Per-IP Token Bucket)
app.rate-limiting.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limiting.ai-recommendation-limit=${RATE_LIMIT_AI_LIMIT:6}
app.rate-limiting.movie-search-limit=${RATE_LIMIT_SEARCH_LIMIT:40}
app.rate-limiting.create-session-limit=${RATE_LIMIT_CREATE_SESSION_LIMIT:5}
app.rate-limiting.join-session-limit=${RATE_LIMIT_JOIN_SESSION_LIMIT:15}
app.rate-limiting.session-action-limit=${RATE_LIMIT_SESSION_ACTION_LIMIT:120}
app.rate-limiting.default-limit=${RATE_LIMIT_DEFAULT_LIMIT:120}
app.rate-limiting.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}